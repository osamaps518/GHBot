name: Bug report
description: Something is broken or behaves wrongly
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where and when
      description: Device or browser, branch or version, screenshots, error messages.
