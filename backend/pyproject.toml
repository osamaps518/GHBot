[project]
name = "ghbot-backend"
version = "0.1.0"
description = "GHBot's FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.17,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.14,<3",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ghbot"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
files = ["src/ghbot"]
strict = true
plugins = ["pydantic.mypy"]
