services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ghbot
      POSTGRES_PASSWORD: ghbot_local
      POSTGRES_DB: ghbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghbot -d ghbot"]
      interval: 2s
      retries: 15

volumes:
  postgres_data:
